# 키오스크 웹 화면 자동 배포 (Cloudflare Workers Static Assets, 구 Pages)
#
# - push / PR: 빌드 검사
# - main 브랜치 push: 빌드 후 library-kiosk 로 배포
# - 필요한 Repository secret: CLOUDFLARE_API_TOKEN (API 서버 배포와 공용)

name: Deploy Kiosk

on:
  push:
    branches: [main]
    paths:
      - 'web/kiosk/**'
      - '.github/workflows/deploy-kiosk.yml'
  pull_request:
    paths:
      - 'web/kiosk/**'
      - '.github/workflows/deploy-kiosk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kiosk-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

defaults:
  run:
    working-directory: web/kiosk

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/kiosk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax check
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build
        run: npm run build

      - name: Verify production API address in bundle
        run: grep -q 'https://library-seat-api.kimkisoo0505.workers.dev/api' dist/assets/*.js

      - name: Dry run (assets only, no bindings)
        run: npx wrangler deploy --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: kiosk-dist
          path: web/kiosk/dist
          retention-days: 3

  deploy:
    name: Deploy to Cloudflare
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '8d6e7f3948c38c9288349f16a597f853' }}
    steps:
      - name: Preflight (secret 확인)
        id: preflight
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN 이 없어 배포를 건너뜁니다."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.preflight.outputs.configured == 'true'

      - uses: actions/setup-node@v5
        if: steps.preflight.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/kiosk/package-lock.json

      - name: Install dependencies
        if: steps.preflight.outputs.configured == 'true'
        run: npm ci

      - uses: actions/download-artifact@v4
        if: steps.preflight.outputs.configured == 'true'
        with:
          name: kiosk-dist
          path: web/kiosk/dist

      - name: Deploy
        if: steps.preflight.outputs.configured == 'true'
        run: npx wrangler deploy
