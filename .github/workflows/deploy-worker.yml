# Cloudflare Workers 자동 배포
#
# - push / PR: 검사(check) 실행 (비밀 값 사용 안 함)
# - main 브랜치 push: 검사 통과 시 D1 마이그레이션 적용 후 Worker 배포
# - GitHub Secrets 가 설정되지 않았으면 배포를 건너뛴다 (경고만 표시)
#
# 필요한 Repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   Workers Scripts:Edit, D1:Edit 권한 토큰
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 계정 ID
#   D1_DATABASE_ID         library-seat-db 의 database_id (UUID)
# 선택 Repository variable:
#   ALLOWED_ORIGINS        예: https://library-kiosk.pages.dev,http://localhost:5173

name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

# 배포가 겹치지 않도록 한 번에 하나만 실행 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

defaults:
  run:
    working-directory: cloudflare

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax check
        run: find workers -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: SQL schema check
        run: |
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect(':memory:')
          db.executescript(open('database/schema.sql', encoding='utf-8').read())
          count = db.execute('select count(*) from seats').fetchone()[0]
          assert count == 30, f'seats={count}'
          print('schema ok, seats =', count)
          PY

      - name: Build (dry run)
        run: |
          cp wrangler.toml.example wrangler.toml
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
    steps:
      - name: Preflight (secrets 확인)
        id: preflight
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$D1_DATABASE_ID" ]; then
            echo "::warning::Cloudflare secrets(CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, D1_DATABASE_ID)가 없어 배포를 건너뜁니다."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install dependencies
        if: steps.preflight.outputs.configured == 'true'
        run: npm ci

      - name: Generate wrangler.toml
        if: steps.preflight.outputs.configured == 'true'
        run: |
          if ! printf '%s' "$D1_DATABASE_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::D1_DATABASE_ID 형식이 올바르지 않습니다 (UUID 필요)."
            exit 1
          fi
          sed "s/<YOUR_D1_DATABASE_ID>/${D1_DATABASE_ID}/" wrangler.toml.example > wrangler.toml
          if [ -n "$ALLOWED_ORIGINS" ]; then
            if ! printf '%s' "$ALLOWED_ORIGINS" | grep -Eq '^[A-Za-z0-9:/.,_-]+$'; then
              echo "::error::ALLOWED_ORIGINS 에 허용되지 않는 문자가 있습니다."
              exit 1
            fi
            sed -i "s|^ALLOWED_ORIGINS = .*|ALLOWED_ORIGINS = \"${ALLOWED_ORIGINS}\"|" wrangler.toml
          fi
          grep -q "$D1_DATABASE_ID" wrangler.toml

      - name: Apply D1 migrations (remote)
        if: steps.preflight.outputs.configured == 'true'
        run: npx wrangler d1 migrations apply library-seat-db --remote

      - name: Deploy Worker
        if: steps.preflight.outputs.configured == 'true'
        run: npx wrangler deploy
