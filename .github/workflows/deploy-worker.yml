# Cloudflare Workers 자동 배포
#
# - push / PR: 검사(check) 실행 (비밀 값 사용 안 함)
# - main 브랜치 push: 검사 통과 시 D1 마이그레이션 적용 후 Worker 배포
# - GitHub Secrets 가 설정되지 않았으면 배포를 건너뛴다 (경고만 표시)
#
# 필요한 Repository secret (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   Workers Scripts:Edit, D1:Edit 권한 토큰
# 선택 (없으면 아래 deploy job 의 기본값 사용):
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 계정 ID
#   D1_DATABASE_ID         library-seat-db 의 database_id (UUID)
# 선택 Repository variable:
#   ALLOWED_ORIGINS        예: https://library-kiosk.pages.dev,http://localhost:5173

name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

# 배포가 겹치지 않도록 한 번에 하나만 실행 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: 'false'

defaults:
  run:
    working-directory: cloudflare

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: JavaScript syntax check
        run: find workers -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: SQL schema check
        run: |
          python3 - <<'PY'
          import sqlite3
          db = sqlite3.connect(':memory:')
          db.executescript(open('database/schema.sql', encoding='utf-8').read())
          count = db.execute('select count(*) from seats').fetchone()[0]
          assert count == 30, f'seats={count}'
          print('schema ok, seats =', count)
          PY

      - name: Build (dry run)
        run: |
          cp wrangler.toml.example wrangler.toml
          npx wrangler deploy --dry-run --outdir .wrangler/dry-run

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # 계정 ID / DB ID 는 민감 정보가 아니다 (API 토큰 없이는 사용 불가).
      # 우선순위: Secrets > Variables > 아래 기본값
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '8d6e7f3948c38c9288349f16a597f853' }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID || vars.D1_DATABASE_ID || '9482b6cd-61dc-4109-a7f8-56148e8253df' }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
      TOKEN_IN_VARS: ${{ vars.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Preflight (secrets 확인)
        id: preflight
        working-directory: .
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$D1_DATABASE_ID" ]        || missing="$missing D1_DATABASE_ID"
          if [ "$TOKEN_IN_VARS" = "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN 이 Variables 에 등록되어 있습니다. Secrets 탭으로 옮기고 Variables 에서는 삭제하세요."
          fi
          if [ -n "$missing" ]; then
            echo "::warning::다음 값이 없어 배포를 건너뜁니다:$missing (Settings > Secrets and variables > Actions > Repository secrets 확인)"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "모든 배포 설정 확인됨"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.preflight.outputs.configured == 'true'

      - uses: actions/setup-node@v5
        if: steps.preflight.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json

      - name: Install dependencies
        if: steps.preflight.outputs.configured == 'true'
        run: npm ci

      - name: Generate wrangler.toml
        if: steps.preflight.outputs.configured == 'true'
        run: |
          if ! printf '%s' "$D1_DATABASE_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'; then
            echo "::error::D1_DATABASE_ID 형식이 올바르지 않습니다 (UUID 필요)."
            exit 1
          fi
          sed "s/<YOUR_D1_DATABASE_ID>/${D1_DATABASE_ID}/" wrangler.toml.example > wrangler.toml
          if [ -n "$ALLOWED_ORIGINS" ]; then
            if ! printf '%s' "$ALLOWED_ORIGINS" | grep -Eq '^[A-Za-z0-9:/.,_-]+$'; then
              echo "::error::ALLOWED_ORIGINS 에 허용되지 않는 문자가 있습니다."
              exit 1
            fi
            sed -i "s|^ALLOWED_ORIGINS = .*|ALLOWED_ORIGINS = \"${ALLOWED_ORIGINS}\"|" wrangler.toml
          fi
          grep -q "$D1_DATABASE_ID" wrangler.toml

      - name: Apply D1 migrations (remote)
        if: steps.preflight.outputs.configured == 'true'
        run: npx wrangler d1 migrations apply library-seat-db --remote

      - name: Deploy Worker
        if: steps.preflight.outputs.configured == 'true'
        run: npx wrangler deploy
